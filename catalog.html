<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📱 Multi-Source Phone Catalog & Scraped Products Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111726;
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #38bdf8;
      --accent: #f43f5e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --badge-text: #38bdf8;
      --price: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans Thai', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 30px 20px;
      min-height: 100vh;
    }

    .container { max-width: 1350px; margin: 0 auto; }
    
    header {
      text-align: center;
      margin-bottom: 30px;
    }
    header h1 {
      font-size: 2.3rem;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    header p { color: var(--text-muted); font-size: 1rem; }

    /* Stats Bar */
    .stats-bar {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 12px 24px;
      border-radius: 12px;
      text-align: center;
      min-width: 140px;
    }
    .stat-num { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
    .stat-label { font-size: 0.85rem; color: var(--text-muted); }

    /* Controls */
    .controls {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
    }
    .search-box {
      flex: 1;
      min-width: 280px;
    }
    .search-box input {
      width: 100%;
      padding: 12px 18px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus { border-color: var(--primary); }

    .platform-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    .tab-btn.active, .tab-btn:hover {
      background: var(--primary);
      color: #000;
      font-weight: 600;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
      border-color: rgba(56, 189, 248, 0.3);
    }

    .card-img-wrap {
      width: 100%;
      height: 230px;
      background: #0b0f19;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 10px;
    }
    .card-source-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .card-source-badge.compasia { border-left: 3px solid #10b981; }
    .card-source-badge.instagram { border-left: 3px solid #ec4899; }

    .card-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .card-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #fff;
    }
    .meta-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .meta-tag {
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .meta-tag.battery { background: rgba(16, 185, 129, 0.15); color: #10b981; }
    .meta-tag.variants { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
    .meta-tag.accessories { background: rgba(168, 85, 247, 0.15); color: #c084fc; }

    .accessories-box {
      font-size: 0.8rem;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .price-row {
      margin-top: auto;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding-top: 14px;
      border-top: 1px solid var(--card-border);
    }
    .price-val {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--price);
    }
    .btn-link {
      font-size: 0.82rem;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>📱 Multi-Source Phone Catalog</h1>
    <p>รวมข้อมูลสินค้ามือสองจาก CompAsia (33 รายการ / 1,107 ตัวเลือก) และ Instagram (228 โพสต์)</p>
  </header>

  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-num" id="compasiaCount">33</div>
      <div class="stat-label">CompAsia สินค้า</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="variantsCount">1,107</div>
      <div class="stat-label">CompAsia ตัวเลือกย่อย</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="instagramCount">228</div>
      <div class="stat-label">Instagram โพสต์</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="imagesCount">374</div>
      <div class="stat-label">รูปภาพในเครื่อง</div>
    </div>
  </div>

  <div class="controls">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🔍 ค้นหารุ่น เช่น iPhone 13 Pro Max, S24 Ultra, 256GB...">
    </div>
    <div class="platform-tabs">
      <button class="tab-btn active" onclick="setPlatform('all')">ทั้งหมด</button>
      <button class="tab-btn" onclick="setPlatform('compasia')">🛍️ CompAsia (33)</button>
      <button class="tab-btn" onclick="setPlatform('instagram')">📸 Instagram (228)</button>
      <button class="tab-btn" onclick="filterBrand('iphone')">iPhone</button>
      <button class="tab-btn" onclick="filterBrand('galaxy')">Samsung Galaxy</button>
    </div>
  </div>

  <div class="grid" id="productGrid"></div>
</div>

<script>
let compasiaItems = [];
let instagramItems = [];
let currentPlatform = 'all';

async function loadAllData() {
  try {
    const [resComp, resIg] = await Promise.all([
      fetch('data/compasia/compasia_all_products.json'),
      fetch('data/instagram/instagram_products_cleaned.json')
    ]);
    compasiaItems = await resComp.json();
    instagramItems = await resIg.json();
    renderGrid(getCombinedItems());
  } catch (err) {
    console.error("Error loading JSON:", err);
  }
}

function getCombinedItems() {
  const formattedComp = compasiaItems.map(c => ({
    source: 'compasia',
    id: c.index,
    title: c.title,
    price: c.price_range,
    badge: `CompAsia (${c.variants_count} ตัวเลือก)`,
    accessories: c.accessories,
    battery: c.battery_health,
    warranty: c.warranty,
    image: c.local_images && c.local_images.length ? c.local_images[0] : '',
    url: c.url,
    vendor: c.vendor
  }));

  const formattedIg = instagramItems.map(i => ({
    source: 'instagram',
    id: i.id,
    title: i.model,
    price: i.price_thb && i.price_thb !== '-' ? `฿${Number(i.price_thb).toLocaleString()}` : 'สอบถามราคา',
    badge: 'Instagram',
    accessories: i.warranty || 'พร้อมส่ง',
    battery: i.battery_health !== '-' ? `🔋 ${i.battery_health}` : '',
    warranty: i.warranty,
    image: i.image_path || '',
    url: i.post_url,
    vendor: 'Apple'
  }));

  if (currentPlatform === 'compasia') return formattedComp;
  if (currentPlatform === 'instagram') return formattedIg;
  return [...formattedComp, ...formattedIg];
}

function renderGrid(items) {
  const grid = document.getElementById('productGrid');
  grid.innerHTML = '';

  if (items.length === 0) {
    grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 50px; color:#64748b;">ไม่พบข้อมูลสินค้าที่ตรงกับคำค้นหา</div>';
    return;
  }

  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';

    const isComp = item.source === 'compasia';
    const badgeClass = isComp ? 'compasia' : 'instagram';

    card.innerHTML = `
      <div class="card-img-wrap">
        <span class="card-source-badge ${badgeClass}">${item.badge}</span>
        <img src="${item.image}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/300x220?text=No+Image'">
      </div>
      <div class="card-body">
        <h3 class="card-title">${item.title}</h3>
        <div class="meta-row">
          ${item.battery ? `<span class="meta-tag battery">${item.battery}</span>` : ''}
          ${item.warranty ? `<span class="meta-tag">${item.warranty}</span>` : ''}
        </div>
        ${item.accessories ? `<div class="accessories-box">📦 <strong>อุปกรณ์:</strong> ${item.accessories}</div>` : ''}
        <div class="price-row">
          <span class="price-val">${item.price}</span>
          <a href="${item.url}" target="_blank" class="btn-link">เปิดดูสินค้า ↗</a>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

function setPlatform(plat) {
  currentPlatform = plat;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderGrid(getCombinedItems());
}

function filterBrand(brand) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  const items = getCombinedItems().filter(i => i.title.toLowerCase().includes(brand.toLowerCase()));
  renderGrid(items);
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  const query = e.target.value.toLowerCase().trim();
  const items = getCombinedItems().filter(i => 
    i.title.toLowerCase().includes(query) || 
    (i.accessories && i.accessories.toLowerCase().includes(query)) ||
    (i.price && i.price.toLowerCase().includes(query))
  );
  renderGrid(items);
});

loadAllData();
</script>
</body>
</html>
