<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Universal Media Grabber</title>
  <style>
    body {
      width: 360px;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      color: #34d399;
    }
    .status {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
    }
    .power-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
      transition: all 0.2s ease;
    }
    .power-box.off {
      border-color: rgba(148, 163, 184, 0.3);
      background: rgba(30, 41, 59, 0.5);
    }
    .power-label {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .power-title {
      font-size: 13px;
      font-weight: 700;
      color: #f8fafc;
    }
    .power-sub {
      font-size: 11px;
      color: #94a3b8;
    }
    .toggle-btn {
      flex: 0 0 auto;
      min-width: 92px;
      border: none;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      color: #ffffff;
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
      transition: all 0.15s ease;
    }
    .toggle-btn.off {
      background: #475569;
      color: #e2e8f0;
      box-shadow: none;
    }
    .dropzone {
      border: 2px dashed rgba(52, 211, 153, 0.45);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      background: rgba(30, 41, 59, 0.65);
      margin-bottom: 12px;
      font-size: 12px;
      color: #cbd5e1;
    }
    .dropzone.dragover {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.15);
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    button.action-btn {
      flex: 1;
      border: none;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, #10b981, #059669);
    }
    button.action-btn.secondary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
    }
    .list {
      max-height: 200px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
    }
    .item span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 190px;
    }
    .item button {
      flex: 0 0 auto;
      border: none;
      border-radius: 6px;
      color: #fff;
      background: #10b981;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    .naming-box {
      background: #1e293b;
      border: 1px solid rgba(59, 130, 246, 0.35);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .naming-title {
      font-size: 12px;
      font-weight: 700;
      color: #93c5fd;
      margin-bottom: 6px;
    }
    .naming-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .naming-input {
      flex: 1;
      background: #0f172a;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 8px;
      padding: 7px 10px;
      color: #f8fafc;
      font-size: 12px;
      outline: none;
    }
    .naming-input:focus {
      border-color: #34d399;
    }
    .naming-clear {
      border: none;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      background: #334155;
      color: #cbd5e1;
    }
    .naming-preview {
      margin-top: 6px;
      font-size: 11px;
      color: #34d399;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">⚡ Universal Media Grabber</div>
    <div class="status" id="server-status">กำลังเช็ก...</div>
  </div>

  <!-- ปุ่มสวิตช์ เปิด / ปิด การทำงาน -->
  <div class="power-box" id="power-box">
    <div class="power-label">
      <div class="power-title" id="power-title">🟢 เปิดใช้งานอยู่ (ON)</div>
      <div class="power-sub" id="power-sub">ชี้รูป/วิดีโอเพื่อโหลด (คีย์ลัด Alt+M)</div>
    </div>
    <button class="toggle-btn" id="btn-toggle-power">เปิดอยู่ (ON)</button>
  </div>

  <!-- ระบบตั้งชื่อไฟล์อัจฉริยะ + ตั้งชื่อเองได้ -->
  <div class="naming-box">
    <div class="naming-title">🏷️ ตั้งชื่อไฟล์นำหน้าเอง (เว้นว่าง = ตั้งตามชื่อสินค้าอัตโนมัติ)</div>
    <div class="naming-row">
      <input type="text" class="naming-input" id="custom-prefix-input" placeholder="เช่น เทียนหอมเซ็ตA, ขวดแก้วสีชา..." />
      <button class="naming-clear" id="btn-clear-prefix" title="กลับไปใช้โหมดตั้งชื่ออัตโนมัติ">ออโต้</button>
    </div>
    <div class="naming-preview" id="naming-preview">✨ โหมดออโต้: รูปภาพ_ชื่อเว็บ_ชื่อสินค้า_01.png / .mp4</div>
  </div>

  <div class="dropzone" id="dropzone">
    📥 ลากรูปหรือวิดีโอมาวางที่นี่เพื่อแปลงเป็น <b>.PNG / .JPG / .MP4</b> ทันที
  </div>
  <div class="actions">
    <button class="action-btn" id="btn-scan">🔍 สแกนทั้งหน้าเว็บ</button>
    <button class="action-btn secondary" id="btn-sandbox">🧪 เปิดหน้าทดสอบ</button>
  </div>
  <div class="list" id="media-list"></div>
  <script src="popup.js"></script>
</body>
</html>
